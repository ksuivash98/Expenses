<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Личный финансовый кабинет с авторизацией Supabase" />
  <title>Личный финансовый кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
</head>
<body class="theme-dark">
  <div class="app-bg" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <img src="assets/icons/logo.svg" alt="" class="brand-logo" width="36" height="36" />
        <div>
          <strong>Финансы</strong>
          <span>Личный кабинет</span>
        </div>
      </div>

      <nav class="nav" aria-label="Главное меню">
        <button type="button" class="nav-item active" data-nav="dashboard"><span>🏠</span> Главная</button>
        <button type="button" class="nav-item" data-nav="income"><span>💰</span> Доходы</button>
        <button type="button" class="nav-item" data-nav="budget"><span>📦</span> Конверты бюджета</button>
        <button type="button" class="nav-item" data-nav="credits"><span>💳</span> Кредиты</button>
        <button type="button" class="nav-item" data-nav="utilities"><span>🏠</span> Коммунальные услуги</button>
        <button type="button" class="nav-item" data-nav="expenses"><span>🛒</span> Покупки</button>
        <button type="button" class="nav-item" data-nav="goals"><span>🎯</span> Финансовые цели</button>
        <button type="button" class="nav-item" data-nav="calendar"><span>📅</span> Календарь</button>
        <button type="button" class="nav-item" data-nav="analytics"><span>📊</span> Аналитика</button>
        <button type="button" class="nav-item" data-nav="compare"><span>📈</span> Сравнение</button>
        <button type="button" class="nav-item" data-nav="archive"><span>🗂</span> Архив</button>
        <button type="button" class="nav-item" data-nav="history"><span>📜</span> История</button>
        <button type="button" class="nav-item" data-nav="profile"><span>👤</span> Профиль</button>
        <button type="button" class="nav-item" data-nav="settings"><span>⚙</span> Настройки</button>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-stat">
          <span>Синхронизация</span>
          <strong id="sync-badge">—</strong>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%">Выйти</button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main">
      <header class="topbar glass">
        <div class="topbar-left">
          <button type="button" class="icon-btn" id="menu-toggle" aria-label="Меню">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <h1 id="page-title">Главная</h1>
        </div>

        <div class="period-switcher glass-soft" id="period-switcher">
          <button type="button" class="icon-btn period-nav" id="period-prev" aria-label="Предыдущий месяц">◀</button>
          <button type="button" class="period-current" id="period-current-btn">
            <strong id="period-label">Период</strong>
            <span class="period-status" id="period-status-label"></span>
          </button>
          <button type="button" class="icon-btn period-nav" id="period-next" aria-label="Следующий месяц">▶</button>
          <div class="period-dropdown hidden" id="period-dropdown"></div>
        </div>

        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="notifications-btn" aria-label="Уведомления">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Z" fill="currentColor"/>
              <path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16l-2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span class="badge-dot" id="notifications-badge" hidden>0</span>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Сменить тему">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="content fade-in" id="page-content"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="dashboard/app.js"></script>
</body>
</html>
