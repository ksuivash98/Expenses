<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный финансовый кабинет</title>
  <script type="module">
    import { authService } from './services/AuthService.js';
    import { isSupabaseConfigured } from './config.js';

    async function boot() {
      if (!isSupabaseConfigured()) {
        window.location.replace('auth/login.html');
        return;
      }
      try {
        const session = await authService.getSession();
        window.location.replace(session ? 'app.html' : 'auth/login.html');
      } catch (error) {
        window.location.replace('auth/login.html');
      }
    }

    boot();
  </script>
</head>
<body style="background:#07111f;color:#fff;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;">
  Загрузка…
</body>
</html>
